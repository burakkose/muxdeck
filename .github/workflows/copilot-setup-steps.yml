name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          if [ -f pyproject.toml ]; then
            HAS_DEV_EXTRA="$(
              python - <<'PY'
import pathlib
import tomllib

pyproject = pathlib.Path("pyproject.toml")
data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
optional = data.get("project", {}).get("optional-dependencies", {})
print("1" if "dev" in optional else "0")
PY
            )"

            if [ "${HAS_DEV_EXTRA}" = "1" ]; then
              python -m pip install -e ".[dev]"
            else
              python -m pip install -e .
            fi
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Run lightweight smoke validation
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
import pathlib
import sqlite3
import sys

assert sys.version_info >= (3, 14), sys.version
assert pathlib.Path(".venv/bin/python").exists()
print(f"python={sys.version.split()[0]}")
print(f"sqlite={sqlite3.sqlite_version}")
PY
          python -m pip check
          python -c "import copilot_commander"

          if [ -d src ] || [ -d tests ]; then
            python -m compileall src tests
          fi
