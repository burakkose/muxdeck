name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
      - AGENTS.md
      - pyproject.toml
      - requirements*.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
      - AGENTS.md
      - pyproject.toml
      - requirements*.txt

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Create virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate

          if [ -f pyproject.toml ]; then
            HAS_DEV_EXTRA="$(
              python -c "import pathlib, tomllib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); optional = data.get('project', {}).get('optional-dependencies', {}); print('1' if 'dev' in optional else '0')"
            )"

            if [ "${HAS_DEV_EXTRA}" = "1" ]; then
              python -m pip install -e ".[dev]"
            else
              python -m pip install -e .
            fi
          fi

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Run lightweight smoke validation
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -c "import pathlib, sqlite3, sys; assert sys.version_info >= (3, 14), sys.version; assert pathlib.Path('.venv/bin/python').exists(); print(f'python={sys.version.split()[0]}'); print(f'sqlite={sqlite3.sqlite_version}')"
          python -m pip check
          python -c "import copilot_commander"

          if [ -d src ] || [ -d tests ]; then
            python -m compileall src tests
          fi
