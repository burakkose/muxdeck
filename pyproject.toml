[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "muxdeck"
version = "0.1.0"
description = "Production-quality local TUI control plane for GitHub Copilot CLI agents in tmux."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "muxdeck contributors" }]
keywords = ["copilot", "python", "textual", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pytest",
  "Framework :: Textual",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "textual>=0.79,<9.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<0.12",
]

[project.scripts]
muxdeck = "muxdeck.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["muxdeck", "muxdeck.*"]

[tool.setuptools.package-data]
muxdeck = ["py.typed", "adapters/migrations/*.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers --cov=muxdeck --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
markers = [
  "integration: marks tests that exercise cross-module or external integrations",
]
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["muxdeck"]

[tool.coverage.paths]
source = ["src/muxdeck", "*/site-packages/muxdeck"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "I",
  "ICN",
  "INP",
  "N",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.isort]
known-first-party = ["muxdeck"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
explicit_package_bases = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_unused_ignores = false
